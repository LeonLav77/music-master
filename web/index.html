<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Katana MkII Control Surface</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="stylesheet" href="app.css" />
<!-- app.js loads Alpine itself, once the parameter schema has arrived. -->
<script type="module" src="js/app.js"></script>
</head>

<body>
<div x-data="desk" x-cloak>

  <!-- Slow amp operation: several seconds of MIDI where nothing visibly
       changes and then everything changes at once. Without this the
       surface just looks frozen. -->
  <div class="busybar" :class="amp.busy && 'show'" aria-live="polite">
    <div class="busybar-track"><div class="busybar-fill"></div></div>
    <template x-if="amp.busy">
      <div class="busybar-label-wrap"><span class="busybar-label" x-text="amp.busy"></span></div>
    </template>
  </div>

  <main class="scene">
  <div class="cabinet amp-tolex">
    <span aria-hidden="true" class="trim trim-top chrome-edge"></span>
    <span aria-hidden="true" class="trim trim-bottom chrome-edge"></span>

    <!-- ---- top control plate: badge + status ---- -->
    <section class="topbar amp-plate">
      <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

      <div class="brand">
        <span class="brand-lamp">
          <span aria-hidden="true" class="brand-glow tube-glow tube-flicker" :class="!glowing && 'dim'"></span>
          <span class="brand-bulb"></span>
        </span>
        <div style="line-height:1">
          <h1 class="brand-name engrave">Katana</h1>
          <span class="brand-sub engrave">MkII · 100W</span>
        </div>
      </div>

      <div class="divider-v"></div>

      <div class="status">
        <span class="patch-name engrave">
          <span x-text="amp.channelNames[amp.channel]"></span>
          <span class="edited" x-show="amp.dirty"> · edited</span>
        </span>

        <div class="status-actions">
          <!-- Whether the amp is actually reachable. Without this a
               disconnected surface looks identical to a working one. -->
          <span class="conn" :title="amp.connection === 'open' ? (amp.ampConnected ? 'Amp connected' : 'Server up, amp not responding - retrying') : 'Cannot reach the server'">
            <span aria-hidden="true" class="dot" :class="'dot-' + amp.statusKind"></span>
            <span class="conn-label engrave" x-text="amp.statusLabel"></span>
          </span>

          <span class="sync-label engrave" x-text="amp.syncLabel"></span>

          <button type="button" class="chip" @click="resync()">
            <svg :class="amp.syncing && 'spin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            resync
          </button>
        </div>
      </div>
    </section>

    <!-- ---- tabs: the amp, and practice (metronome + backing tracks) ----
         Hidden, not removed, when not shown: nothing reconnects or resets,
         and a song keeps playing while you tweak the amp. -->
    <nav class="tabs" aria-label="Sections">
      <button type="button" class="seg" :class="tab === 'amp' && 'active'" :aria-pressed="tab === 'amp'" @click="showTab('amp')">Amp</button>
      <button type="button" class="seg" :class="tab === 'practice' && 'active'" :aria-pressed="tab === 'practice'" @click="showTab('practice')">
        Practice
        <span class="tab-dot" x-show="practice.metronome.running || practice.track?.playing" aria-hidden="true"></span>
      </button>
    </nav>

    <!-- ---- channel rail ---- -->
    <div style="flex-shrink:0" x-data="channelRail" x-show="tab === 'amp'">
      <div class="rail">
        <template x-for="channel in channels" :key="channel.id">
          <button
            type="button"
            class="rail-btn"
            :class="[amp.channel === channel.id && 'active', channel.id === 'panel' && 'panel']"
            :disabled="amp.busy !== null"
            @click="amp.selectChannel(channel.id)"
            @pointerdown="holdStart(channel.id)"
            @pointerup="holdEnd()"
            @pointerleave="holdEnd()"
          >
            <span class="rail-bank" x-text="channel.id === 'panel' ? 'panel' : channel.bank + channel.id.slice(1)"></span>
            <span class="rail-name" x-text="amp.channelNames[channel.id]"></span>
          </button>
        </template>
      </div>

      <!-- Press-and-hold overwrites a stored patch. Permanently destructive,
           so it always asks first. -->
      <template x-if="pending">
        <div class="overlay center" @click.self="pending = null">
          <div class="confirm" role="alertdialog" aria-modal="true">
            <h2>Overwrite <span x-text="amp.channelNames[pending]"></span>?</h2>
            <p>This writes the live panel sound into the stored slot. The sound currently saved there is lost permanently.</p>
            <div class="confirm-actions">
              <button type="button" class="btn" @click="pending = null">Cancel</button>
              <button type="button" class="btn btn-danger" @click="confirm()">Overwrite</button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- ---- cabinet body ---- -->
    <section class="body-grid" x-show="tab === 'amp'">

      <!-- amp control plate -->
      <div class="plate amp-plate">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

        <!-- amp model selector -->
        <div class="ampdial" x-data="ampDial(180)">
          <div
            class="ampdial-face"
            role="slider"
            aria-label="Amp model"
            :aria-valuenow="value"
            :aria-valuetext="name"
            tabindex="0"
            :style="`width:${size}px;height:${size}px`"
            @pointerdown="drag.down($event)"
            @pointermove="drag.move($event)"
            @pointerup="drag.up($event)"
            @pointercancel="drag.up($event)"
            @keydown="drag.key($event)"
          >
            <div class="ampdial-ring" aria-hidden="true"></div>
            <template x-for="mark in orbit" :key="mark.label">
              <span class="ampdial-orbit" :style="orbitStyle(mark)" x-text="mark.label"></span>
            </template>
            <svg viewBox="0 0 100 100" style="width:100%;height:100%">
              <defs>
                <radialGradient id="ampcap" cx="32%" cy="25%">
                  <stop offset="0" stop-color="var(--metal-light)" />
                  <stop offset="0.28" stop-color="var(--panel-raised)" />
                  <stop offset="0.72" stop-color="var(--cap)" />
                  <stop offset="1" stop-color="var(--metal-dark)" />
                </radialGradient>
              </defs>
              <circle cx="50" cy="50" r="33" fill="url(#ampcap)" class="stroke-track" stroke-width="1.5" />
              <circle cx="50" cy="50" r="26" class="fill-metal-dark" opacity="0.55" />
              <g :transform="`rotate(${pointerAngle} 50 50)`">
                <line x1="50" y1="20" x2="50" y2="34" class="stroke-ember" stroke-width="4" stroke-linecap="round" />
              </g>
            </svg>
          </div>
          <span class="ampdial-name" x-text="name"></span>
        </div>

        <!-- amp knobs -->
        <div class="knob-grid">
          <template x-for="ampKnob in ampKnobs" :key="ampKnob.key">
            <div x-data="knob(ampKnob.key, ampKnob.label, { accent: ampKnob.accent, size: 'md' })">
              <div class="knob">
                <div
                  class="knob-dial"
                  role="slider"
                  :aria-label="label"
                  :aria-valuenow="value"
                  :aria-valuemin="min"
                  :aria-valuemax="max"
                  tabindex="0"
                  :style="`width:min(${sizePx}, 100%)`"
                  @pointerdown="drag.down($event)"
                  @pointermove="drag.move($event)"
                  @pointerup="drag.up($event)"
                  @pointercancel="drag.up($event)"
                  @keydown="drag.key($event)"
                >
                  <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                    <defs>
                      <radialGradient :id="capId" cx="32%" cy="25%">
                        <stop offset="0" stop-color="var(--metal-light)" />
                        <stop offset="0.28" stop-color="var(--panel-raised)" />
                        <stop offset="0.72" stop-color="var(--cap)" />
                        <stop offset="1" stop-color="var(--metal-dark)" />
                      </radialGradient>
                    </defs>
                    <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                    <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" :class="accent === 'ember' ? 'stroke-ember' : 'stroke-steel'" />
                    <ellipse cx="50" cy="62" rx="36" ry="31" class="fill-metal-dark" opacity="0.9" />
                    <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                    <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                    <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                    <ellipse cx="41" cy="33" rx="15" ry="8" fill="oklch(1 0 0 / 14%)" transform="rotate(-22 41 33)" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(0 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(15 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(30 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(45 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(60 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(75 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(90 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(105 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(120 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(135 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(150 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(165 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(180 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(195 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(210 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(225 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(240 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(255 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(270 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(285 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(300 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(315 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(330 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(345 50 48)" class="tick" />
                    <g :transform="`rotate(${angle} 50 48)`">
                      <line x1="50" y1="21" x2="50" y2="41" stroke-width="4.5" stroke-linecap="round" stroke="oklch(0 0 0 / 60%)" transform="translate(0 1.5)" />
                      <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" :class="accent === 'ember' ? 'stroke-ember' : 'stroke-steel'" />
                    </g>
                  </svg>
                  <span class="knob-readout" x-text="readout"></span>
                </div>
                <span class="knob-label" x-text="label"></span>
              </div>
            </div>
          </template>

          <!-- The amp never reports physical knob turns, so this one is read-only. -->
          <div x-data="knob('knob_volume', 'Knob Vol', { size: 'md', disabled: true })">
            <div class="knob">
              <div class="knob-dial static disabled" :style="`width:min(${sizePx}, 100%)`">
                <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                  <defs>
                    <radialGradient :id="capId" cx="32%" cy="25%">
                      <stop offset="0" stop-color="var(--metal-light)" />
                      <stop offset="0.28" stop-color="var(--panel-raised)" />
                      <stop offset="0.72" stop-color="var(--cap)" />
                      <stop offset="1" stop-color="var(--metal-dark)" />
                    </radialGradient>
                  </defs>
                  <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                  <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" class="stroke-steel" />
                  <ellipse cx="50" cy="62" rx="36" ry="31" class="fill-metal-dark" opacity="0.9" />
                  <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                  <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                  <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                  <g :transform="`rotate(${angle} 50 48)`">
                    <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" class="stroke-steel" />
                  </g>
                </svg>
                <span class="knob-readout" x-text="readout"></span>
              </div>
              <span class="knob-label" x-text="label"></span>
            </div>
          </div>

          <button
            type="button"
            class="toggle-btn"
            :class="amp.bool('bright') && 'on'"
            :aria-pressed="amp.bool('bright')"
            @click="amp.toggle('bright')"
          >bright</button>
        </div>
      </div>

      <!-- pedalboard -->
      <div class="pedalboard amp-grille">
        <div class="stomp-grid">
          <template x-for="block in blocks" :key="block.id">
            <div class="stomp" :class="[amp.bool(block.sw) && 'on', tileColor(block.label)]">
              <span class="stomp-sheen" aria-hidden="true"></span>
              <button type="button" class="stomp-face" :aria-pressed="amp.bool(block.sw)" @click="amp.toggle(block.sw)">
                <span class="stomp-row">
                  <span class="stomp-name" x-text="block.label"></span>
                  <span style="position:relative;display:flex;height:1rem;width:1rem;align-items:center;justify-content:center">
                    <span class="led" :class="['led-' + (block.led ? amp.led(block.led) : 'off'), amp.bool(block.sw) && block.led && amp.led(block.led) !== 'off' && 'signal-breathe']"></span>
                  </span>
                </span>
                <span class="stomp-sub" x-text="block.sub || (amp.bool(block.sw) ? 'engaged' : 'bypassed')"></span>
                <span class="stomp-bar"></span>
              </button>
              <button type="button" class="stomp-gear" :aria-label="block.label + ' settings'" @click="openBlock = block.id">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
              </button>
            </div>
          </template>
        </div>

        <div class="footswitches">
          <template x-for="footswitch in footswitches" :key="footswitch.cc">
            <button
              type="button"
              class="footswitch"
              :class="footswitch.block && amp.bool(footswitch.block) && 'on'"
              :title="`${footswitch.label} — CC${footswitch.cc}`"
              @click="pressFootswitch(footswitch)"
            ><span x-text="footswitch.label"></span></button>
          </template>
        </div>
      </div>

      <!-- wah riser -->
      <div class="riser amp-tolex">
        <span aria-hidden="true" class="trim trim-top chrome-edge" style="left:.5rem;right:.5rem;height:2px"></span>
        <div class="treadle-wrap" style="flex:1" x-data="treadle">
          <div class="treadle-head">
            <span class="treadle-title">Wah</span>
            <span class="treadle-range" x-text="`${min}–${max}`"></span>
          </div>
          <div
            class="treadle-slab"
            :class="on && 'on'"
            x-ref="slab"
            role="slider"
            aria-label="Wah treadle position"
            :aria-valuenow="value"
            aria-valuemin="0"
            aria-valuemax="100"
            tabindex="0"
            :style="slabStyle"
            @pointerdown="down($event)"
            @pointermove="move($event)"
            @pointerup="up($event)"
            @pointercancel="up($event)"
            @keydown="key($event)"
          >
            <div class="treadle-fill" :style="`height:${fillHeight}`"></div>
            <div class="treadle-tread"></div>
            <span class="treadle-value" x-text="value"></span>
          </div>
          <div class="treadle-actions">
            <button type="button" class="chip" style="justify-content:center" @click="$store.katana.setWah(!on)" x-text="on ? 'wah on' : 'wah off'"></button>
            <button type="button" class="chip muted" style="justify-content:center" @click="openBlock = 'wah'">setup</button>
          </div>

        </div>
      </div>
    </section>

    <!-- ---- practice: metronome and backing tracks ---- -->
    <section class="practice" x-show="tab === 'practice'">
      <p class="practice-banner" x-show="!practice.available">
        No audio output: the server could not open the Pi's headphone jack.
      </p>

      <!-- metronome -->
      <div class="practice-plate amp-plate">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

        <h2 class="practice-title engrave">Metronome</h2>

        <div class="bpm">
          <button type="button" class="chip" @click="practice.setBpm(practice.metronome.bpm - 5)">−5</button>
          <button type="button" class="chip" @click="practice.setBpm(practice.metronome.bpm - 1)">−1</button>
          <div class="bpm-readout">
            <span x-text="Math.round(practice.metronome.bpm)"></span>
            <small>bpm</small>
          </div>
          <button type="button" class="chip" @click="practice.setBpm(practice.metronome.bpm + 1)">+1</button>
          <button type="button" class="chip" @click="practice.setBpm(practice.metronome.bpm + 5)">+5</button>
        </div>
        <input type="range" class="slider" min="40" max="240" step="1" aria-label="Tempo"
               :value="practice.metronome.bpm"
               @input="practice.setBpm($event.target.valueAsNumber)" />

        <div class="field">
          <span class="field-label">Beats per bar</span>
          <div class="segmented">
            <template x-for="beats in [2, 3, 4, 6]" :key="beats">
              <button type="button" class="seg" :class="practice.metronome.beats_per_bar === beats && 'active'"
                      @click="practice.setMetronome({ beats_per_bar: beats })" x-text="beats"></button>
            </template>
          </div>
        </div>

        <div class="field">
          <span class="field-label">Volume <span x-text="Math.round(practice.metronome.volume * 100) + '%'"></span></span>
          <input type="range" class="slider" min="0" max="1" step="0.05" aria-label="Metronome volume"
                 :value="practice.metronome.volume"
                 @input="practice.setMetronome({ volume: $event.target.valueAsNumber })" />
        </div>

        <div class="practice-actions">
          <button type="button" class="toggle-btn" :class="practice.metronome.running && !practice.countingIn && 'on'"
                  :disabled="!practice.available"
                  @click="practice.toggleMetronome()"
                  x-text="practice.metronome.running && !practice.countingIn ? 'stop' : 'start'"></button>
          <button type="button" class="toggle-btn" @click="practice.tapMetronome()">tap</button>
        </div>
      </div>

      <!-- backing tracks: also the drop zone for new songs. dragenter and
           dragleave fire for every child crossed, so count them. -->
      <div class="practice-plate amp-plate" x-data="{ dragDepth: 0 }"
           :class="dragDepth > 0 && 'dropping'"
           @dragenter.prevent="dragDepth++"
           @dragover.prevent
           @dragleave="dragDepth = Math.max(dragDepth - 1, 0)"
           @drop.prevent="dragDepth = 0; practice.upload($event.dataTransfer.files)">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

        <div class="practice-head">
          <h2 class="practice-title engrave">Backing tracks</h2>
          <!-- The way in on a phone, which has no drag and drop. -->
          <label class="chip">
            add song
            <input type="file" class="visually-hidden" multiple
                   accept=".mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,audio/*"
                   @change="practice.upload($event.target.files); $event.target.value = ''" />
          </label>
        </div>

        <p class="practice-empty" x-show="!practice.tracks.length && !practice.uploads.length">
          No songs yet. Drop audio files here, or tap <em>add song</em>.
        </p>

        <template x-for="upload in practice.uploads" :key="upload.id">
          <div class="upload-row" :class="upload.error && 'failed'">
            <div class="upload-text">
              <span class="upload-name" x-text="practice.displayName(upload.name)"></span>
              <span class="upload-state"
                    x-text="upload.error ? 'failed' : (upload.progress < 1 ? Math.round(upload.progress * 100) + '%' : 'preparing…')"></span>
            </div>
            <div class="upload-bar"><div :style="`width:${upload.progress * 100}%`"></div></div>
            <p class="upload-error" x-show="upload.error" x-text="upload.error"></p>
          </div>
        </template>

        <div class="track-list">
          <template x-for="entry in practice.tracks" :key="entry.name">
            <div class="track-row-wrap">
              <button type="button" class="rail-btn track-row" :class="practice.selected === entry.name && 'active'"
                      @click="practice.select(entry.name)">
                <span class="rail-name" x-text="practice.displayName(entry.name)"></span>
                <span class="rail-bank"
                      x-text="practice.track?.name === entry.name && practice.track.playing ? 'playing' : (entry.ready ? 'ready' : 'loading…')"></span>
              </button>
              <button type="button" class="track-delete" :aria-label="'Delete ' + practice.displayName(entry.name)"
                      @click="practice.askDelete(entry.name)">×</button>
            </div>
          </template>
        </div>

        <template x-if="practice.pendingDelete">
          <div class="overlay center" @click.self="practice.pendingDelete = null">
            <div class="confirm" role="alertdialog" aria-modal="true">
              <h2>Delete <span x-text="practice.displayName(practice.pendingDelete)"></span>?</h2>
              <p>This removes the file from the Pi. Its count-in settings in this browser are kept, in case you add it again.</p>
              <div class="confirm-actions">
                <button type="button" class="btn" @click="practice.pendingDelete = null">Cancel</button>
                <button type="button" class="btn btn-danger" @click="practice.confirmDelete()">Delete</button>
              </div>
            </div>
          </div>
        </template>

        <template x-if="practice.selected">
          <div class="track-panel">
            <div class="track-now">
              <span class="track-title" x-text="practice.displayName(practice.selected)"></span>
              <span class="track-status" x-text="practice.status"></span>
            </div>

            <div x-data="{ dragging: false, draft: 0 }">
              <input type="range" class="slider" min="0" step="0.1" aria-label="Position in song"
                     :max="practice.duration || 1"
                     :disabled="!practice.isCurrent"
                     :value="dragging ? draft : practice.elapsed"
                     @pointerdown="dragging = true; draft = practice.elapsed"
                     @input="draft = $event.target.valueAsNumber"
                     @change="practice.seek(draft); dragging = false" />
              <div class="track-times">
                <span x-text="practice.clock(dragging ? draft : practice.elapsed)"></span>
                <span x-text="practice.isCurrent ? practice.clock(practice.duration) : '–:––'"></span>
              </div>
            </div>

            <div class="practice-actions">
              <template x-if="practice.isCurrent && practice.track.playing">
                <button type="button" class="toggle-btn on" @click="practice.pause()">pause</button>
              </template>
              <template x-if="practice.isCurrent && !practice.track.playing && practice.track.elapsed > 0">
                <button type="button" class="toggle-btn" @click="practice.resume()">resume</button>
              </template>
              <button type="button" class="toggle-btn" :disabled="!practice.available || practice.loading !== null"
                      @click="practice.play()"
                      x-text="practice.isCurrent && (practice.track.playing || practice.track.elapsed > 0) ? 'restart' : 'play'"></button>
              <button type="button" class="toggle-btn" :disabled="!practice.isCurrent" @click="practice.stop()">stop</button>
            </div>

            <div class="field">
              <span class="field-label">Song volume <span x-text="Math.round(practice.songVolume * 100) + '%'"></span></span>
              <input type="range" class="slider" min="0" max="1" step="0.05" aria-label="Song volume"
                     :disabled="!practice.available"
                     :value="practice.songVolume"
                     @input="practice.setSongVolume($event.target.valueAsNumber)" />
            </div>

            <div class="song-settings">
              <div class="field">
                <span class="field-label">Count-in beats</span>
                <div class="segmented">
                  <template x-for="beats in [0, 2, 4, 8]" :key="beats">
                    <button type="button" class="seg" :class="practice.song.countIn === beats && 'active'"
                            @click="practice.updateSong({ countIn: beats })" x-text="beats === 0 ? 'off' : beats"></button>
                  </template>
                </div>
              </div>
              <div class="song-numbers">
                <label class="field">
                  <span class="field-label">Song BPM</span>
                  <span class="number-row">
                    <input type="number" class="number-input" min="20" max="400" step="1"
                           :value="practice.song.bpm"
                           @change="practice.updateSong({ bpm: Math.min(Math.max($event.target.valueAsNumber || 120, 20), 400) })" />
                    <button type="button" class="chip" @click="practice.tapSong()">tap</button>
                  </span>
                </label>
                <label class="field">
                  <span class="field-label">Beat 1 at (s)</span>
                  <input type="number" class="number-input" min="0" max="60" step="0.01"
                         :value="practice.song.firstBeat"
                         @change="practice.updateSong({ firstBeat: Math.min(Math.max($event.target.valueAsNumber || 0, 0), 60) })" />
                </label>
              </div>
            </div>

          </div>
        </template>
      </div>
    </section>
  </div>

  <!-- ---- EQ dock: anchored bottom-right, clear of the footswitch row ---- -->
  <div class="eq-anchor" :class="expanded && 'open'" @click.self="toggleExpanded()" x-data="eqPad" x-show="tab === 'amp'">
    <div class="eq-dock" :class="!expanded && 'collapsed'">
      <div class="eq-head">
        <button type="button" class="eq-toggle" @click="toggleExpanded()" :aria-expanded="expanded">
          <span class="eq-title" x-text="on ? 'EQ' : 'EQ · bypassed'"></span>
          <span class="eq-caret" x-text="expanded ? '▾' : '▸'"></span>
        </button>
        <span class="eq-actions" x-show="expanded">
          <button type="button" class="chip" @click="$store.katana.toggle('eq_switch')" x-text="on ? 'on' : 'off'"></button>
          <button type="button" class="chip muted" @click="flat()">flat</button>
          <button type="button" class="chip muted" @click="openBlock = 'eq'">setup</button>
        </span>
      </div>

      <!-- Draw-anywhere: drag across the pad and the band values follow the
           finger, the numbers are derived instead of typed in. -->
      <div x-show="expanded">
      <div
        class="eq-pad"
        :class="dragging && 'dragging'"
        x-ref="pad"
        role="application"
        aria-label="Graphic EQ curve — drag to shape"
        style="height:150px"
        @pointerdown="down($event)"
        @pointermove="move($event)"
        @pointerup="up($event)"
        @pointercancel="up($event)"
      >
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
          <line x1="0" y1="50" x2="100" y2="50" class="stroke-hairline" stroke-width="0.6" />
          <path :d="fill" :class="on ? 'fill-steel-soft' : 'fill-muted-soft'" />
          <path :d="curve" fill="none" stroke-width="1.6" vector-effect="non-scaling-stroke" :class="on ? 'stroke-steel' : 'stroke-steel-dim'" />
        </svg>
      </div>
      <div class="eq-labels">
        <template x-for="(band, index) in bands" :key="band.key">
          <span :class="hover === index && 'hot'" x-text="hover === index ? $store.katana.num(band.key) : band.label"></span>
        </template>
      </div>
      </div>

      <!-- collapsed: the curve alone, still readable at a glance -->
      <div class="eq-mini" x-show="!expanded">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
          <line x1="0" y1="50" x2="100" y2="50" class="stroke-hairline" stroke-width="0.6" />
          <path :d="curve" fill="none" stroke-width="1.6" vector-effect="non-scaling-stroke" :class="on ? 'stroke-steel' : 'stroke-steel-dim'" />
        </svg>
      </div>
    </div>
  </div>

  <!-- ---- block editor sheet ---- -->
  <template x-if="openBlock">
    <div class="overlay" @click.self="openBlock = null">
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-inner">
          <h2 class="sheet-title" x-text="titles[openBlock]"></h2>

          <!-- effect chooser, for the two FX slots -->
          <template x-if="editor && editor.fxSlot">
            <div class="field">
              <span class="field-label">effect</span>
              <div class="segmented">
                <template x-for="effect in editor.fxSlot.options" :key="effect.value">
                  <button
                    type="button" class="seg"
                    :class="effect.value === editor.fxSlot.current && 'active'"
                    @click="amp.set(editor.fxSlot.typeKey, effect.value)"
                    x-text="effect.label"
                  ></button>
                </template>
              </div>
            </div>
          </template>

          <!-- enum pickers: flat, always-visible rows instead of dropdowns -->
          <template x-for="param in (editor ? editor.enums : [])" :key="param.key">
            <div class="field">
              <span class="field-label" x-text="param.label"></span>
              <div class="segmented">
                <template x-for="option in param.options" :key="option.value">
                  <button
                    type="button" class="seg"
                    :class="option.value === amp.num(param.key) && 'active'"
                    @click="amp.set(param.key, option.value)"
                    x-text="option.label"
                  ></button>
                </template>
              </div>
            </div>
          </template>

          <template x-if="editor && editor.note">
            <p style="border:1px dashed var(--hairline);border-radius:3px;background:var(--panel);padding:1rem .75rem;font-family:var(--font-mono);font-size:.68rem;color:var(--muted-foreground)" x-text="editor.note"></p>
          </template>

          <!-- the block's own knobs -->
          <div class="knob-row">
            <template x-for="param in (editor ? editor.knobs : [])" :key="param.key">
              <div x-data="knob(param.key, param.label, { size: 'sm', min: param.min, max: param.max, unit: param.unit })">
                <div class="knob">
                  <div
                    class="knob-dial"
                    role="slider"
                    :aria-label="label"
                    :aria-valuenow="value"
                    :aria-valuemin="min"
                    :aria-valuemax="max"
                    tabindex="0"
                    :style="`width:min(${sizePx}, 100%)`"
                    @pointerdown="drag.down($event)"
                    @pointermove="drag.move($event)"
                    @pointerup="drag.up($event)"
                    @pointercancel="drag.up($event)"
                    @keydown="drag.key($event)"
                  >
                    <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                      <defs>
                        <radialGradient :id="capId" cx="32%" cy="25%">
                          <stop offset="0" stop-color="var(--metal-light)" />
                          <stop offset="0.28" stop-color="var(--panel-raised)" />
                          <stop offset="0.72" stop-color="var(--cap)" />
                          <stop offset="1" stop-color="var(--metal-dark)" />
                        </radialGradient>
                      </defs>
                      <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                      <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" class="stroke-steel" />
                      <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                      <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                      <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                      <g :transform="`rotate(${angle} 50 48)`">
                        <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" class="stroke-steel" />
                      </g>
                    </svg>
                    <span class="knob-readout" x-text="readout"></span>
                  </div>
                  <span class="knob-label" x-text="label"></span>
                </div>
              </div>
            </template>

            <template x-for="param in (editor ? editor.toggles : [])" :key="param.key">
              <button
                type="button" class="toggle-btn"
                :class="amp.bool(param.key) && 'on'"
                :aria-pressed="amp.bool(param.key)"
                @click="amp.toggle(param.key)"
                x-text="param.label"
              ></button>
            </template>
          </div>

          <div style="display:flex;justify-content:flex-end;margin-top:1.5rem">
            <button type="button" class="btn" @click="openBlock = null">close</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  </main>
</div>
</body>
</html>
