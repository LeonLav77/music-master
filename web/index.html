<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Katana MkII Control Surface</title>
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="stylesheet" href="fonts.css" />
<link rel="stylesheet" href="app.css" />
<script type="module" src="js/app.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>

<body>
<div x-data="desk" x-cloak>

  <!-- Slow amp operation: several seconds of MIDI where nothing visibly
       changes and then everything changes at once. Without this the
       surface just looks frozen. -->
  <div class="busybar" :class="k.busy && 'show'" aria-live="polite">
    <div class="busybar-track"><div class="busybar-fill"></div></div>
    <template x-if="k.busy">
      <div class="busybar-label-wrap"><span class="busybar-label" x-text="k.busy"></span></div>
    </template>
  </div>

  <main class="scene amp-scene">
  <div class="cabinet amp-tolex amp-tilt">
    <span aria-hidden="true" class="trim trim-top chrome-edge"></span>
    <span aria-hidden="true" class="trim trim-bottom chrome-edge"></span>

    <!-- ---- top control plate: badge + status ---- -->
    <section class="topbar amp-plate">
      <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
      <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

      <div class="brand">
        <span class="brand-lamp">
          <span aria-hidden="true" class="brand-glow tube-glow tube-flicker" :class="!glowing && 'dim'"></span>
          <span class="brand-bulb"></span>
        </span>
        <div style="line-height:1">
          <h1 class="brand-name engrave">Katana</h1>
          <span class="brand-sub engrave">MkII · 100W</span>
        </div>
      </div>

      <div class="divider-v"></div>

      <div class="status">
        <!-- The deck is a separate page: a different job, and the amp
             surface is already full at the sizes this runs on. -->
        <nav class="pagetabs" aria-label="Sections">
          <button type="button" class="pagetab" :class="page === 'amp' && 'active'"
                  :aria-current="page === 'amp' ? 'page' : false"
                  @click="page = 'amp'">amp</button>
          <button type="button" class="pagetab" :class="page === 'deck' && 'active'"
                  :aria-current="page === 'deck' ? 'page' : false"
                  @click="page = 'deck'">deck</button>
        </nav>

        <span class="patch-name engrave" x-show="page === 'amp'">
          <span x-text="k.channelNames[k.channel]"></span>
          <span class="edited" x-show="k.dirty"> · edited</span>
        </span>

        <span class="patch-name engrave" x-show="page === 'deck'"
              :class="d.error && 'edited'" x-text="d.label"></span>

        <div class="status-actions">
          <!-- Playback state, on both pages: a backing track running while
               you are on the amp page still needs to be visible. -->
          <span class="conn" x-show="d.active" title="A backing track is playing into AUX IN">
            <span aria-hidden="true" class="dot dot-amber"></span>
            <span class="conn-label engrave" x-text="d.counting ? 'count-in' : d.paused ? 'paused' : 'aux'"></span>
          </span>

          <!-- Whether the amp is actually reachable. Without this a
               disconnected surface looks identical to a working one. -->
          <span class="conn" :title="k.connection === 'open' ? (k.ampConnected ? 'Amp connected' : 'Server up, amp not responding - retrying') : 'Cannot reach the server'">
            <span aria-hidden="true" class="dot" :class="'dot-' + k.statusKind"></span>
            <span class="conn-label engrave" x-text="k.statusLabel"></span>
          </span>

          <span class="sync-label engrave" x-show="page === 'amp'" x-text="k.syncLabel"></span>

          <button type="button" class="chip" x-show="page === 'amp'" @click="resync()">
            <svg :class="k.syncing && 'spin'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            resync
          </button>
        </div>
      </div>
    </section>

    <!-- ---- channel rail ---- -->
    <div style="flex-shrink:0" x-show="page === 'amp'" x-data="channelRail">
      <div class="rail">
        <template x-for="c in channels" :key="c.id">
          <button
            type="button"
            class="rail-btn"
            :class="[k.channel === c.id && 'active', c.id === 'panel' && 'panel']"
            :disabled="k.busy !== null"
            @click="k.selectChannel(c.id)"
            @pointerdown="holdStart(c.id)"
            @pointerup="holdEnd()"
            @pointerleave="holdEnd()"
          >
            <span class="rail-bank" x-text="c.id === 'panel' ? 'panel' : c.bank + c.id.slice(1)"></span>
            <span class="rail-name" x-text="k.channelNames[c.id]"></span>
          </button>
        </template>
      </div>

      <!-- Press-and-hold overwrites a stored patch. Permanently destructive,
           so it always asks first. -->
      <template x-if="pending">
        <div class="overlay center" @click.self="pending = null">
          <div class="confirm" role="alertdialog" aria-modal="true">
            <h2>Overwrite <span x-text="k.channelNames[pending]"></span>?</h2>
            <p>This writes the live panel sound into the stored slot. The sound currently saved there is lost permanently.</p>
            <div class="confirm-actions">
              <button type="button" class="btn" @click="pending = null">Cancel</button>
              <button type="button" class="btn btn-danger" @click="confirm()">Overwrite</button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- ---- cabinet body ---- -->
    <section class="body-grid" x-show="page === 'amp'">

      <!-- amp control plate -->
      <div class="plate amp-plate">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;bottom:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;bottom:.375rem"></span>

        <!-- amp model selector -->
        <div class="ampdial" x-data="ampDial(180)">
          <div
            class="ampdial-face"
            role="slider"
            aria-label="Amp model"
            :aria-valuenow="value"
            :aria-valuetext="name"
            tabindex="0"
            :style="`width:${size}px;height:${size}px`"
            @pointerdown="drag.down($event)"
            @pointermove="drag.move($event)"
            @pointerup="drag.up($event)"
            @pointercancel="drag.up($event)"
            @keydown="drag.key($event)"
          >
            <div class="ampdial-ring" aria-hidden="true"></div>
            <template x-for="o in orbit" :key="o.label">
              <span class="ampdial-orbit" :style="orbitStyle(o)" x-text="o.label"></span>
            </template>
            <svg viewBox="0 0 100 100" style="width:100%;height:100%">
              <defs>
                <radialGradient id="ampcap" cx="32%" cy="25%">
                  <stop offset="0" stop-color="var(--metal-light)" />
                  <stop offset="0.28" stop-color="var(--panel-raised)" />
                  <stop offset="0.72" stop-color="var(--cap)" />
                  <stop offset="1" stop-color="var(--metal-dark)" />
                </radialGradient>
              </defs>
              <circle cx="50" cy="50" r="33" fill="url(#ampcap)" class="stroke-track" stroke-width="1.5" />
              <circle cx="50" cy="50" r="26" class="fill-metal-dark" opacity="0.55" />
              <g :transform="`rotate(${pointerAngle} 50 50)`">
                <line x1="50" y1="20" x2="50" y2="34" class="stroke-ember" stroke-width="4" stroke-linecap="round" />
              </g>
            </svg>
          </div>
          <span class="ampdial-name" x-text="name"></span>
        </div>

        <!-- amp knobs -->
        <div class="knob-grid">
          <template x-for="kn in ampKnobs" :key="kn.key">
            <div x-data="knob(kn.key, kn.label, { accent: kn.accent, size: 'md' })">
              <div class="knob">
                <div
                  class="knob-dial"
                  role="slider"
                  :aria-label="label"
                  :aria-valuenow="value"
                  :aria-valuemin="min"
                  :aria-valuemax="max"
                  tabindex="0"
                  :style="`width:min(${sizePx}, 100%)`"
                  @pointerdown="drag.down($event)"
                  @pointermove="drag.move($event)"
                  @pointerup="drag.up($event)"
                  @pointercancel="drag.up($event)"
                  @keydown="drag.key($event)"
                >
                  <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                    <defs>
                      <radialGradient :id="capId" cx="32%" cy="25%">
                        <stop offset="0" stop-color="var(--metal-light)" />
                        <stop offset="0.28" stop-color="var(--panel-raised)" />
                        <stop offset="0.72" stop-color="var(--cap)" />
                        <stop offset="1" stop-color="var(--metal-dark)" />
                      </radialGradient>
                    </defs>
                    <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                    <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" :class="accent === 'ember' ? 'stroke-ember' : 'stroke-steel'" />
                    <ellipse cx="50" cy="62" rx="36" ry="31" class="fill-metal-dark" opacity="0.9" />
                    <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                    <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                    <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                    <ellipse cx="41" cy="33" rx="15" ry="8" fill="oklch(1 0 0 / 14%)" transform="rotate(-22 41 33)" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(0 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(15 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(30 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(45 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(60 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(75 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(90 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(105 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(120 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(135 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(150 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(165 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(180 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(195 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(210 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(225 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(240 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(255 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(270 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(285 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(300 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(315 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(330 50 48)" class="tick" />
                    <line x1="50" y1="17" x2="50" y2="22" transform="rotate(345 50 48)" class="tick" />
                    <g :transform="`rotate(${angle} 50 48)`">
                      <line x1="50" y1="21" x2="50" y2="41" stroke-width="4.5" stroke-linecap="round" stroke="oklch(0 0 0 / 60%)" transform="translate(0 1.5)" />
                      <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" :class="accent === 'ember' ? 'stroke-ember' : 'stroke-steel'" />
                    </g>
                  </svg>
                  <span class="knob-readout" x-text="readout"></span>
                </div>
                <span class="knob-label" x-text="label"></span>
              </div>
            </div>
          </template>

          <!-- The amp never reports physical knob turns, so this one is read-only. -->
          <div x-data="knob('knob_volume', 'Knob Vol', { size: 'md', disabled: true })">
            <div class="knob">
              <div class="knob-dial static disabled" :style="`width:min(${sizePx}, 100%)`">
                <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                  <defs>
                    <radialGradient :id="capId" cx="32%" cy="25%">
                      <stop offset="0" stop-color="var(--metal-light)" />
                      <stop offset="0.28" stop-color="var(--panel-raised)" />
                      <stop offset="0.72" stop-color="var(--cap)" />
                      <stop offset="1" stop-color="var(--metal-dark)" />
                    </radialGradient>
                  </defs>
                  <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                  <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" class="stroke-steel" />
                  <ellipse cx="50" cy="62" rx="36" ry="31" class="fill-metal-dark" opacity="0.9" />
                  <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                  <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                  <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                  <g :transform="`rotate(${angle} 50 48)`">
                    <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" class="stroke-steel" />
                  </g>
                </svg>
                <span class="knob-readout" x-text="readout"></span>
              </div>
              <span class="knob-label" x-text="label"></span>
            </div>
          </div>

          <button
            type="button"
            class="toggle-btn"
            :class="k.bool('bright') && 'on'"
            :aria-pressed="k.bool('bright')"
            @click="k.toggle('bright')"
          >bright</button>
        </div>
      </div>

      <!-- pedalboard -->
      <div class="pedalboard amp-grille">
        <div class="stomp-grid">
          <template x-for="b in blocks" :key="b.id">
            <div class="stomp" :class="[k.bool(b.sw) && 'on', tileColor(b.label)]">
              <span class="stomp-sheen" aria-hidden="true"></span>
              <button type="button" class="stomp-face" :aria-pressed="k.bool(b.sw)" @click="k.toggle(b.sw)">
                <span class="stomp-row">
                  <span class="stomp-name" x-text="b.label"></span>
                  <span style="position:relative;display:flex;height:1rem;width:1rem;align-items:center;justify-content:center">
                    <span class="led" :class="['led-' + (b.led ? k.led(b.led) : 'off'), k.bool(b.sw) && b.led && k.led(b.led) !== 'off' && 'signal-breathe']"></span>
                  </span>
                </span>
                <span class="stomp-sub" x-text="b.sub || (k.bool(b.sw) ? 'engaged' : 'bypassed')"></span>
                <span class="stomp-bar"></span>
              </button>
              <button type="button" class="stomp-gear" :aria-label="b.label + ' settings'" @click="openBlock = b.id">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
              </button>
            </div>
          </template>
        </div>

        <div class="footswitches">
          <template x-for="fs in footswitches" :key="fs.cc">
            <button
              type="button"
              class="footswitch"
              :class="fs.block && k.bool(fs.block) && 'on'"
              :title="`${fs.label} — CC${fs.cc}`"
              @click="pressFootswitch(fs)"
            ><span x-text="fs.label"></span></button>
          </template>
        </div>
      </div>

      <!-- wah riser -->
      <div class="riser amp-tolex">
        <span aria-hidden="true" class="trim trim-top chrome-edge" style="left:.5rem;right:.5rem;height:2px"></span>
        <div class="treadle-wrap" style="flex:1" x-data="treadle">
          <div class="treadle-head">
            <span class="treadle-title">Wah</span>
            <span class="treadle-range" x-text="`${min}–${max}`"></span>
          </div>
          <div
            class="treadle-slab"
            :class="on && 'on'"
            x-ref="slab"
            role="slider"
            aria-label="Wah treadle position"
            :aria-valuenow="value"
            aria-valuemin="0"
            aria-valuemax="100"
            tabindex="0"
            :style="slabStyle"
            @pointerdown="down($event)"
            @pointermove="move($event)"
            @pointerup="up($event)"
            @pointercancel="up($event)"
            @keydown="key($event)"
          >
            <div class="treadle-fill" :style="`height:${fillHeight}`"></div>
            <div class="treadle-tread"></div>
            <span class="treadle-value" x-text="value"></span>
          </div>
          <div class="treadle-actions">
            <button type="button" class="chip" style="justify-content:center" @click="$store.katana.setWah(!on)" x-text="on ? 'wah on' : 'wah off'"></button>
            <button type="button" class="chip muted" style="justify-content:center" @click="sweepWah()">sweep</button>
            <button type="button" class="chip muted" style="justify-content:center" @click="openBlock = 'wah'">setup</button>
          </div>

        <!-- Custom repeating sweep: N rocks of low..high, `seconds` each.
             Inside the treadle wrap so it sits directly under the action
             row - as a sibling the wrap's flex:1 pushed it to the riser
             floor and left a gap. -->
        <div x-data="wahRock">
          <!-- Trigger and configure are separate: the gesture is the thing you
               reach for mid-playing, so it fires on one press. The gear is
               deliberately small - settings are a set-once affair. -->
          <div class="rock-row">
            <button
              type="button"
              class="chip rock-fire"
              @click="run()"
              :disabled="invalid || running || $store.katana.busy !== null"
              :title="`run ${summary}`"
            >
              <span x-text="running ? 'rocking…' : 'rock'"></span>
              <span class="rock-summary" x-text="summary"></span>
            </button>
            <button
              type="button"
              class="chip muted rock-gear"
              @click="open = true"
              :disabled="running || $store.katana.busy !== null"
              aria-label="Configure the wah sweep"
              title="Configure"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
          </div>

          <template x-if="open">
            <div class="overlay center" @click.self="open = false">
              <div class="rock-panel" role="dialog" aria-modal="true" aria-label="Custom wah sweep">
                <h2>Custom wah sweep</h2>
                <p class="rock-sentence">
                  <input type="number" min="1" max="32" step="1" x-model.number="intervals" aria-label="intervals" />
                  <span>intervals of</span>
                  <input type="number" min="0" max="100" step="1" x-model.number="low" aria-label="from" />
                  <span>to</span>
                  <input type="number" min="0" max="100" step="1" x-model.number="high" aria-label="to" />
                  <span>in</span>
                  <input type="number" min="0.05" max="30" step="0.1" x-model.number="seconds" aria-label="seconds each" />
                  <span>seconds each</span>
                </p>

                <label class="rock-check">
                  <input type="checkbox" x-model="bounce" />
                  <span x-text="bounce ? 'rock down and back' : 'sweep up, snap back'"></span>
                </label>

                <p class="rock-total">
                  total <strong x-text="total + 's'"></strong>
                  <span class="rock-bad" x-show="invalid" x-text="invalid"></span>
                </p>
                <p class="rock-bad" x-show="error" x-text="error"></p>

                <!-- No run button here: the panel only configures, the
                     treadle button fires. -->
                <div class="confirm-actions">
                  <button type="button" class="btn" :disabled="invalid" @click="open = false">done</button>
                </div>
              </div>
            </div>
          </template>
        </div>
        </div>
      </div>
    </section>

    <!-- ================= AUX DECK ================= -->
    <!-- Backing tracks out the analog jack into the amp's AUX IN. Nothing
         here touches MIDI - see server/audio.py for why the two halves
         stay apart. -->
    <div class="deck-grid" x-show="page === 'deck'">

      <!-- ---- transport ---- -->
      <section class="deck-plate amp-plate">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>

        <div class="deck-head">
          <span class="deck-title engrave">Transport</span>
          <span class="deck-hint" :class="d.error && 'bad'" x-text="d.label"></span>
        </div>

        <div class="now" :class="d.active && 'live'">
          <span class="now-title" :class="!d.track && 'empty'"
                x-text="d.track ? d.track.replace(/\.[^.]+$/, '') : 'nothing loaded'"></span>

          <!-- Seeking restarts the player server-side, so the bar commits
               on release rather than seeking as it is dragged. -->
          <div
            class="scrub"
            :class="!d.track && 'idle'"
            x-ref="bar"
            x-data="scrubber"
            role="slider"
            aria-label="Track position"
            aria-valuemin="0"
            aria-valuemax="100"
            :aria-valuenow="Math.round(percent)"
            tabindex="0"
            @pointerdown="down($event)"
            @pointermove="move($event)"
            @pointerup="up($event)"
            @pointercancel="up($event)"
            @keydown="key($event)"
          >
            <div class="scrub-track"><div class="scrub-fill" :style="`width:${percent}%`"></div></div>
            <div class="scrub-head" :style="`left:${percent}%`"></div>
          </div>

          <div class="times">
            <span class="cur" x-text="d.elapsedLabel"></span>
            <span x-text="d.durationLabel"></span>
          </div>
        </div>

        <div class="tbar">
          <button type="button" class="tbtn primary" :class="d.active && 'live'"
                  :disabled="d.busy || (!d.track && !d.tracks.length)"
                  :aria-label="d.playing ? 'Pause' : 'Play'"
                  @click="d.toggle()">
            <template x-if="d.playing">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
            </template>
            <template x-if="!d.playing">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
            </template>
          </button>

          <button type="button" class="tbtn" aria-label="Stop"
                  :disabled="!d.active && !d.position" @click="d.stop()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
          </button>

          <button type="button" class="tbtn" :class="d.loop && 'on'"
                  :aria-pressed="d.loop" aria-label="Loop track"
                  @click="d.loop = !d.loop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          </button>

          <div class="level">
            <span class="level-label">level</span>
            <input type="range" min="0" max="100" step="1"
                   aria-label="Aux output level"
                   :style="`--pct:${d.volume * 100}%`"
                   :value="Math.round(d.volume * 100)"
                   @input="d.setVolume($event.target.value / 100)" />
            <span class="level-val" :class="d.hot && 'hot'" x-text="d.volume.toFixed(2)"></span>
          </div>
        </div>

        <!-- Make-up gain. Its own row rather than a second fader beside
             `level`: that one is free and instant, this one rebuilds the
             audio through a limiter and restarts the track. -->
        <div class="boost" :class="d.boostDb && 'on'">
          <div class="boost-head">
            <span class="boost-title" x-text="d.boostDb ? 'boost' : 'boost · off'"></span>
            <span class="boost-note" x-text="d.boostLabel"></span>
          </div>
          <div class="boost-steps" role="group" aria-label="Backing track boost">
            <template x-for="db in [0, 3, 6, 9, 12]" :key="db">
              <button type="button" class="boost-step"
                      :class="d.boostDb === db && 'active'"
                      :disabled="db > d.maxBoostDb || d.busy"
                      :aria-pressed="d.boostDb === db"
                      @click="d.applyBoost(db)"
                      x-text="db ? `+${db}` : 'off'"></button>
            </template>
          </div>
        </div>

        <!-- Count-in. A property of how you are practising today, not of
             the recording - the file on disk is never modified. -->
        <div class="countin" :class="!d.countIn && 'off'" x-data="tapTempo">
          <div class="countin-head">
            <span class="countin-title" x-text="d.countIn ? 'count-in' : 'count-in · off'"></span>
            <button type="button" class="chip muted" style="padding:.25rem .5rem;font-size:.55rem"
                    @click="tap()">tap tempo</button>
            <button type="button" class="switch" :class="d.countIn && 'on'"
                    role="switch" :aria-checked="d.countIn" aria-label="Count-in"
                    @click="d.countIn = !d.countIn"></button>
          </div>

          <p class="rock-sentence" style="font-size:.82rem;line-height:2">
            <input type="number" min="1" max="8" step="1" aria-label="bars"
                   :disabled="!d.countIn" x-model.number="d.bars" />
            <span x-text="d.bars === 1 ? 'bar of' : 'bars of'"></span>
            <input type="number" min="30" max="300" step="1" aria-label="BPM"
                   :disabled="!d.countIn" x-model.number="d.bpm" />
            <span>bpm in</span>
            <input type="number" min="2" max="12" step="1" aria-label="beats per bar"
                   :disabled="!d.countIn" x-model.number="d.beatsPerBar" />
            <span>beats per bar —</span>
            <strong style="color:var(--signal-lime)" x-text="d.countInSeconds.toFixed(1) + ' s'"></strong>
          </p>

          <!-- One lamp per beat, lit as the click runs. -->
          <div class="pips" aria-hidden="true">
            <template x-for="i in d.beats" :key="i">
              <span class="pip"
                    :class="[(i - 1) % d.beatsPerBar === 0 && 'downbeat',
                             d.counting && (i - 1) <= d.currentBeat && 'lit']"></span>
            </template>
            <span class="pips-note"
                  x-text="d.counting ? `beat ${d.currentBeat + 1} of ${d.beats}` : `${d.beats} beats before the track`"></span>
          </div>
        </div>
      </section>

      <!-- ---- library ---- -->
      <section class="deck-plate amp-plate">
        <span aria-hidden="true" class="screw hardware-screw" style="left:.375rem;top:.375rem"></span>
        <span aria-hidden="true" class="screw hardware-screw" style="right:.375rem;top:.375rem"></span>

        <div class="deck-head">
          <span class="deck-title engrave">Library</span>
          <span class="deck-hint" x-text="`${d.tracks.length} track${d.tracks.length === 1 ? '' : 's'}`"></span>
        </div>

        <form class="paste-row" @submit.prevent="d.fetch($refs.url.value); $refs.url.value = ''">
          <input type="url" class="deck-input" x-ref="url" :disabled="d.fetching"
                 placeholder="Paste a YouTube link to add it to the library" />
          <button type="submit" class="chip amber" :disabled="d.fetching"
                  x-text="d.fetching ? 'fetching…' : 'fetch'"></button>
        </form>

        <div class="search-row">
          <input type="search" class="deck-input" placeholder="Filter tracks" x-model="d.filter" />
          <button type="button" class="chip muted" @click="d.reload()">rescan</button>
        </div>

        <div class="tracklist">
          <template x-for="t in d.visibleTracks" :key="t.file">
            <div class="track-row" :class="d.track === t.file && 'current'">
              <button type="button" class="track-name" style="text-align:left"
                      @click="d.choose(t)" x-text="t.name"></button>
              <span class="track-dur" x-text="t.duration ? Math.floor(t.duration / 60) + ':' + String(Math.floor(t.duration % 60)).padStart(2, '0') : '--:--'"></span>
              <button type="button" class="track-drop" :aria-label="`Delete ${t.name}`"
                      @click="confirm(`Delete ${t.name}? The file is removed from disk.`) && d.remove(t)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
              </button>
            </div>
          </template>

          <template x-if="!d.visibleTracks.length">
            <p class="empty-note" x-text="d.filter ? 'No track matches that.' : 'Drop audio files into tracks/, or paste a YouTube link above.'"></p>
          </template>
        </div>
      </section>
    </div>

    <!-- ---- routing: which jack the audio actually leaves by ---- -->
    <section class="routing amp-grille" x-show="page === 'deck'">
      <span class="routing-label">output</span>
      <select x-model="d.sink" aria-label="Audio output device">
        <template x-for="s in d.sinks" :key="s.name">
          <option :value="s.name" x-text="s.name + (s.reamps ? '  — re-amps, do not use' : '')"></option>
        </template>
      </select>
      <span class="routing-label">→ Katana AUX IN</span>
      <span class="warn" x-show="d.hot">above 0.85 the analog jack clips — balance with the amp's master instead</span>
    </section>
  </div>

  <!-- ---- EQ dock: anchored bottom-right, clear of the footswitch row ---- -->
  <div class="eq-anchor" x-show="page === 'amp'" :class="expanded && 'open'" @click.self="toggleExpanded()" x-data="eqPad">
    <div class="eq-dock" :class="!expanded && 'collapsed'">
      <div class="eq-head">
        <button type="button" class="eq-toggle" @click="toggleExpanded()" :aria-expanded="expanded">
          <span class="eq-title" x-text="on ? 'EQ' : 'EQ · bypassed'"></span>
          <span class="eq-caret" x-text="expanded ? '▾' : '▸'"></span>
        </button>
        <span class="eq-actions" x-show="expanded">
          <button type="button" class="chip" @click="$store.katana.toggle('eq_switch')" x-text="on ? 'on' : 'off'"></button>
          <button type="button" class="chip muted" @click="flat()">flat</button>
          <button type="button" class="chip muted" @click="openBlock = 'eq'">setup</button>
        </span>
      </div>

      <!-- Draw-anywhere: drag across the pad and the band values follow the
           finger, the numbers are derived instead of typed in. -->
      <div x-show="expanded">
      <div
        class="eq-pad"
        :class="dragging && 'dragging'"
        x-ref="pad"
        role="application"
        aria-label="Graphic EQ curve — drag to shape"
        style="height:150px"
        @pointerdown="down($event)"
        @pointermove="move($event)"
        @pointerup="up($event)"
        @pointercancel="up($event)"
      >
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
          <line x1="0" y1="50" x2="100" y2="50" class="stroke-hairline" stroke-width="0.6" />
          <path :d="fill" :class="on ? 'fill-steel-soft' : 'fill-muted-soft'" />
          <path :d="curve" fill="none" stroke-width="1.6" vector-effect="non-scaling-stroke" :class="on ? 'stroke-steel' : 'stroke-steel-dim'" />
        </svg>
      </div>
      <div class="eq-labels">
        <template x-for="(b, i) in bands" :key="b.key">
          <span :class="hover === i && 'hot'" x-text="hover === i ? $store.katana.num(b.key) : b.label"></span>
        </template>
      </div>
      </div>

      <!-- collapsed: the curve alone, still readable at a glance -->
      <div class="eq-mini" x-show="!expanded">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">
          <line x1="0" y1="50" x2="100" y2="50" class="stroke-hairline" stroke-width="0.6" />
          <path :d="curve" fill="none" stroke-width="1.6" vector-effect="non-scaling-stroke" :class="on ? 'stroke-steel' : 'stroke-steel-dim'" />
        </svg>
      </div>
    </div>
  </div>

  <!-- ---- block editor sheet ---- -->
  <template x-if="openBlock">
    <div class="overlay" @click.self="openBlock = null">
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-inner">
          <h2 class="sheet-title" x-text="titles[openBlock]"></h2>

          <!-- effect chooser, for the two FX slots -->
          <template x-if="editor && editor.fxSlot">
            <div class="field">
              <span class="field-label">effect</span>
              <div class="segmented">
                <template x-for="f in editor.fxSlot.options" :key="f.value">
                  <button
                    type="button" class="seg"
                    :class="f.value === editor.fxSlot.current && 'active'"
                    @click="k.set(editor.fxSlot.typeKey, f.value)"
                    x-text="f.label"
                  ></button>
                </template>
              </div>
            </div>
          </template>

          <!-- enum pickers: flat, always-visible rows instead of dropdowns -->
          <template x-for="p in (editor ? editor.enums : [])" :key="p.key">
            <div class="field">
              <span class="field-label" x-text="p.label"></span>
              <div class="segmented">
                <template x-for="o in p.options" :key="o.value">
                  <button
                    type="button" class="seg"
                    :class="o.value === k.num(p.key) && 'active'"
                    @click="k.set(p.key, o.value)"
                    x-text="o.label"
                  ></button>
                </template>
              </div>
            </div>
          </template>

          <template x-if="editor && editor.note">
            <p style="border:1px dashed var(--hairline);border-radius:3px;background:var(--panel);padding:1rem .75rem;font-family:var(--font-mono);font-size:.68rem;color:var(--muted-foreground)" x-text="editor.note"></p>
          </template>

          <!-- the block's own knobs -->
          <div class="knob-row">
            <template x-for="p in (editor ? editor.knobs : [])" :key="p.key">
              <div x-data="knob(p.key, p.label, { size: 'sm', min: p.min, max: p.max, unit: p.unit })">
                <div class="knob">
                  <div
                    class="knob-dial"
                    role="slider"
                    :aria-label="label"
                    :aria-valuenow="value"
                    :aria-valuemin="min"
                    :aria-valuemax="max"
                    tabindex="0"
                    :style="`width:min(${sizePx}, 100%)`"
                    @pointerdown="drag.down($event)"
                    @pointermove="drag.move($event)"
                    @pointerup="drag.up($event)"
                    @pointercancel="drag.up($event)"
                    @keydown="drag.key($event)"
                  >
                    <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">
                      <defs>
                        <radialGradient :id="capId" cx="32%" cy="25%">
                          <stop offset="0" stop-color="var(--metal-light)" />
                          <stop offset="0.28" stop-color="var(--panel-raised)" />
                          <stop offset="0.72" stop-color="var(--cap)" />
                          <stop offset="1" stop-color="var(--metal-dark)" />
                        </radialGradient>
                      </defs>
                      <path :d="trackPath" class="stroke-track" fill="none" stroke-width="7" stroke-linecap="round" />
                      <path :d="valuePath" fill="none" stroke-width="7" stroke-linecap="round" class="stroke-steel" />
                      <ellipse cx="50" cy="58" rx="34" ry="30" :fill="`url(#${capId})`" />
                      <ellipse cx="50" cy="48" rx="31" ry="30" class="fill-metal-dark" />
                      <circle cx="50" cy="48" r="30" :fill="`url(#${capId})`" stroke="color-mix(in oklab, var(--metal-light) 30%, transparent)" stroke-width="1.5" />
                      <g :transform="`rotate(${angle} 50 48)`">
                        <line x1="50" y1="21" x2="50" y2="41" stroke-width="4" stroke-linecap="round" class="stroke-steel" />
                      </g>
                    </svg>
                    <span class="knob-readout" x-text="readout"></span>
                  </div>
                  <span class="knob-label" x-text="label"></span>
                </div>
              </div>
            </template>

            <template x-for="p in (editor ? editor.toggles : [])" :key="p.key">
              <button
                type="button" class="toggle-btn"
                :class="k.bool(p.key) && 'on'"
                :aria-pressed="k.bool(p.key)"
                @click="k.toggle(p.key)"
                x-text="p.label"
              ></button>
            </template>
          </div>

          <div style="display:flex;justify-content:flex-end;margin-top:1.5rem">
            <button type="button" class="btn" @click="openBlock = null">close</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  </main>
</div>
</body>
</html>
